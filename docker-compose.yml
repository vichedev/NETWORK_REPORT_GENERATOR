services:
  report-generator:
    build: .
    container_name: redcom-reports-safe
    # Puerto externo 8888 -> Node non-root escuchando en 8080
    ports:
      - "8888:8080"
    volumes:
      # ─────────────────────────────────────────────────────────────────
      # AQUÍ VIVEN TUS DATOS: base de datos SQLite, imágenes archivadas de
      # los informes y la clave maestra de cifrado de las API keys.
      #
      # Es un volumen con nombre, así que SOBREVIVE a:
      #   docker compose up -d --build     (actualizar el código)
      #   docker compose down              (parar el servicio)
      #   docker compose restart
      #
      # Solo se borra si lo pides expresamente:
      #   docker compose down -v           ← ¡ESTE borra la base de datos!
      #   docker volume rm network_report_generator_report_data
      # ─────────────────────────────────────────────────────────────────
      - report_data:/app/data
    networks:
      - network_reports_bridge
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          # El backend maneja imágenes en base64 en memoria: 256M se queda corto.
          memory: 512M
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  report_data:
    # Nombre fijo, igual al que Docker habría generado por defecto desde esta
    # carpeta. Al fijarlo, los datos siguen ahí aunque muevas o renombres el
    # directorio del proyecto.
    name: network_report_generator_report_data

networks:
  network_reports_bridge:
    driver: bridge
    ipam:
      config:
        # Forzamos un pool de IPs que no choque con tus redes de ISP
        - subnet: 172.99.0.0/24
